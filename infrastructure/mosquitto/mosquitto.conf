persistence true
persistence_location /mosquitto/data/
log_dest stdout

listener 1883 0.0.0.0
allow_anonymous false
password_file /mosquitto/config/passwd
acl_file /mosquitto/config/acl

# Terminate TLS at a private network gateway, or enable a 8883 listener with
# cafile/certfile/keyfile for ESP32 clients outside the trusted LAN.

